---
- name: Resolve identity facts when missing
  ansible.builtin.include_role:
    name: odem.os.user
    tasks_from: identity.yml
    public: true
  when: user_resolved is not defined or user_default_repo_dir_mps is not defined

- name: Check if repo directory exists
  ansible.builtin.file:
    path: "{{ scripts_repos_dir }}"
    state: directory
    mode: "0777"
    owner: "root"
    group: "root"

- name: Check if mps-terminal-scripts directory exists
  ansible.builtin.stat:
    path: "{{ scripts_repos_dir }}/mps-terminal-scripts"
  register: scripts_repo_dir

- name: Check if mps-terminal-scripts is a Git repository
  ansible.builtin.stat:
    path: "{{ scripts_repos_dir }}/mps-terminal-scripts/.git"
  register: scripts_git_dir
  when: scripts_repo_dir.stat.exists

- name: Clone mps-terminal-scripts repository
  ansible.builtin.git:
    repo: "{{ scripts_repo }}"
    dest: "{{ scripts_repos_dir }}/mps-terminal-scripts"
    version: "{{ scripts_version }}"
    force: true
  become: true
  when: not scripts_repo_dir.stat.exists

- name: Ensure permissions for target directory
  ansible.builtin.file:
    path: "{{ scripts_repos_dir }}/mps-terminal-scripts"
    state: directory
    owner: "root"
    group: "{{ user_default_admin_group }}"
    recurse: yes
    mode: "2775"
  become: true

- name: Pull mps-terminal-scripts repository
  ansible.builtin.git:
    repo: "{{ scripts_repo }}"
    dest: "{{ scripts_repos_dir }}/mps-terminal-scripts"
    version: "{{ scripts_version }}"
    force: true
    update: true
  become: true
  when:
    - scripts_repo_dir.stat.exists
    - scripts_git_dir.stat.exists

- name: Ensure per-user .local/bin directory exists
  ansible.builtin.file:
    path: "{{ entity.home }}/.local/bin"
    state: directory
    mode: "0700"
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
  loop: "{{ user_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.terminal_scripts | default(false)
    - entity.state == 'present'

- name: Deploy per-user helper scripts
  ansible.builtin.copy:
    src: "{{ scripts_repos_dir }}/mps-terminal-scripts/scripts/"
    dest: "{{ entity.home }}/.local/bin/"
    remote_src: true
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0700"
    directory_mode: "0700"
  loop: "{{ user_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.terminal_scripts | default(false)
    - entity.state == 'present'


- name: Ensure correct permissions on per-user .local/bin tree
  ansible.builtin.file:
    path: "{{ entity.home }}/.local/bin"
    state: directory
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0700"
    recurse: true
  loop: "{{ user_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.terminal_scripts | default(false)
    - entity.state == 'present'
