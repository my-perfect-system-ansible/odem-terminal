---
# Lightweight verify for odem.terminal.tmux: the tmux package is installed
# and molecule_user's config directory exists.

- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Gather installed packages
      ansible.builtin.package_facts:

    - name: tmux package is installed
      ansible.builtin.assert:
        that:
          - "'tmux' in ansible_facts.packages"

    - name: molecule_user tmux config directory exists
      ansible.builtin.stat:
        path: /home/molecule_user/.config/tmux
      register: tmux_config
      failed_when: not tmux_config.stat.exists
