---
- name: Install tmux and tmuxinator (Debian)
  ansible.builtin.package:
    name:
      - tmux
      - tmuxinator
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Install tmux via dnf CLI
  ansible.builtin.command: dnf install -y tmux
  when: ansible_facts['os_family'] == 'RedHat'
  register: dnf_install_tmux
  changed_when: "'Nothing to do' not in dnf_install_tmux.stdout"

- name: Install rubygems for tmuxinator via dnf CLI
  ansible.builtin.command: dnf install -y ruby rubygems
  when: ansible_facts['os_family'] == 'RedHat'
  register: dnf_install_rubygems
  changed_when: "'Nothing to do' not in dnf_install_rubygems.stdout"

- name: Install tmuxinator via gem
  ansible.builtin.command: gem install tmuxinator --no-user-install
  when: ansible_facts['os_family'] == 'RedHat'
  register: gem_install_tmuxinator
  changed_when: "'Successfully installed tmuxinator' in gem_install_tmuxinator.stdout"
  failed_when: >-
    gem_install_tmuxinator.rc != 0 and
    'already installed' not in gem_install_tmuxinator.stderr

- name: Check if repo directory exists
  ansible.builtin.file:
    path: "{{ tmux_repos_dir }}"
    state: directory
    mode: "0777"
    owner: "root"
    group: "root"

- name: Check if mps-terminal-tmux directory exists
  ansible.builtin.stat:
    path: "{{ tmux_repos_dir }}/mps-terminal-tmux"
  register: tmux_repo_dir

- name: Check if mps-terminal-tmux is a Git repository
  ansible.builtin.stat:
    path: "{{ tmux_repos_dir }}/mps-terminal-tmux/.git"
  register: tmux_git_dir
  when: tmux_repo_dir.stat.exists

- name: Clone mps-terminal-tmux repository
  ansible.builtin.git:
    repo: "{{ tmux_repo }}"
    dest: "{{ tmux_repos_dir }}/mps-terminal-tmux"
    version: "{{ tmux_version }}"
    force: true
  become: true
  when: not tmux_repo_dir.stat.exists

- name: Ensure permissions for target directory
  ansible.builtin.file:
    path: "{{ tmux_repos_dir }}/mps-terminal-tmux"
    state: directory
    owner: "root"
    group: "{{ user_default_admin_group }}"
    recurse: yes
    mode: "2775"
  become: true

- name: Pull mps-terminal-tmux repository
  ansible.builtin.git:
    repo: "{{ tmux_repo }}"
    dest: "{{ tmux_repos_dir }}/mps-terminal-tmux"
    version: "{{ tmux_version }}"
    force: true
    update: true
  become: true
  when:
    - tmux_repo_dir.stat.exists

- name: Deploy per-user tmux configuration tree
  ansible.builtin.copy:
    src: "{{ tmux_repos_dir }}/mps-terminal-tmux/config/tmux/"
    dest: "{{ entity.home }}/.config/tmux/"
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0600"
    directory_mode: "0700"
  loop: "{{ user_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.terminal_tmux | default(false)
    - entity.state == 'present'

- name: Deploy per-user tmuxinator configuration tree
  ansible.builtin.copy:
    src: "{{ tmux_repos_dir }}/mps-terminal-tmux/config/tmuxinator/"
    dest: "{{ entity.home }}/.config/tmuxinator/"
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0600"
    directory_mode: "0700"
  loop: "{{ user_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.terminal_tmux | default(false)
    - entity.state == 'present'
