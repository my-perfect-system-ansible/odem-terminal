---
# Minimal converge: invoke the role with default vars + a synthetic user
# opted into exactly this role. nvim downloads tarballs/npm/cargo per user —
# slow but container-safe.

- name: Converge
  hosts: all
  become: true
  vars:
    user_catalog:
      molecule_user:
        user_roles:
          terminal_nvim: true
    user_list:
      - name: molecule_user
  roles:
    - role: odem.terminal.nvim
