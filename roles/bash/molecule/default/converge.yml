---
# Minimal converge: invoke the role with default vars + a synthetic user
# opted into exactly this role.

- name: Converge
  hosts: all
  become: true
  vars:
    user_catalog:
      molecule_user:
        user_roles:
          terminal_bash: true
    user_list:
      - name: molecule_user
  roles:
    - role: odem.terminal.bash
