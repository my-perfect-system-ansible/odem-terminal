---
# Lightweight verify for odem.terminal.vim: the vim package is installed and
# molecule_user's .vimrc landed.

- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Gather installed packages
      ansible.builtin.package_facts:

    - name: vim package is installed
      ansible.builtin.assert:
        that:
          - "'vim' in ansible_facts.packages"

    - name: molecule_user .vimrc exists
      ansible.builtin.stat:
        path: /home/molecule_user/.vimrc
      register: vimrc
      failed_when: not vimrc.stat.exists
