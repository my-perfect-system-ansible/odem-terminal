---
# Lightweight verify for odem.terminal.python: molecule_user's default
# virtualenv exists with its interpreter.

- name: Verify
  hosts: all
  become: true
  tasks:
    - name: molecule_user default venv interpreter exists
      ansible.builtin.stat:
        path: /home/molecule_user/.venvs/default/bin/python
      register: python_venv
      failed_when: not python_venv.stat.exists
