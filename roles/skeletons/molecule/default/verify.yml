---
# Lightweight verify for odem.terminal.skeletons: the skeleton drop-in
# directory /etc/mps/skeletons landed.

- name: Verify
  hosts: all
  become: true
  tasks:
    - name: /etc/mps/skeletons exists
      ansible.builtin.stat:
        path: /etc/mps/skeletons
      register: skeletons_dir
      failed_when: not skeletons_dir.stat.exists

    - name: skeleton files exist under /etc/mps/skeletons
      ansible.builtin.find:
        paths: /etc/mps/skeletons
      register: skeleton_files
      failed_when: skeleton_files.matched | int == 0
