---
# Minimal converge: invoke the role with default vars + a synthetic user.
# odem.terminal.skeletons is system-wide (no per-user gating).

- name: Converge
  hosts: all
  become: true
  vars:
    user_catalog:
      molecule_user:
        user_roles: {}
    user_list:
      - name: molecule_user
  roles:
    - role: odem.terminal.skeletons
