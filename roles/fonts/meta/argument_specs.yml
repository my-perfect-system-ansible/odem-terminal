---
argument_specs:
  main:
    short_description: Install Nerd and icon fonts system-wide via the mps-terminal-fonts repo
    options:
      fonts_repo:
        type: str
        required: false
        default: https://github.com/my-perfect-system/mps-terminal-fonts.git
        description: Git repository cloned and installed
      fonts_repos_dir:
        type: str
        required: false
        default: "{{ identity_default_repo_dir_mps }}"
        description: System-wide mps repo dir the clone lands in
      fonts_version:
        type: str
        required: false
        default: main
        description: Branch/tag of the mps-terminal-fonts repo