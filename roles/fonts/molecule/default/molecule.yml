---
# Molecule scenario for odem.terminal.fonts — lightweight smoke test on both
# supported platform families (Debian trixie + Fedora).
dependency:
  name: galaxy
  enabled: false

driver:
  name: docker

platforms:
  - name: odem-terminal-fonts-debian
    image: geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    command: /bin/sh -c "while true; do sleep 1000; done"
  - name: odem-terminal-fonts-fedora
    image: geerlingguy/docker-fedora44-ansible:latest
    pre_build_image: true
    command: /bin/sh -c "while true; do sleep 1000; done"

provisioner:
  name: ansible
  playbooks:
    converge: converge.yml
  inventory:
    group_vars:
      all:
        ansible_user: root

verifier:
  name: ansible
