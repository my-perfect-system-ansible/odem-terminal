---
# Lightweight verify for odem.terminal.fonts: the repo installer ran and a
# JetBrains Mono Nerd Font is registered with fontconfig.

- name: Verify
  hosts: all
  become: true
  tasks:
    - name: fc-list runs without error
      ansible.builtin.command: fc-list
      changed_when: false
      register: fonts_fc_list

    - name: JetBrains Mono Nerd Font is installed
      ansible.builtin.assert:
        that:
          - fonts_fc_list.stdout is search('(?i)jetbrainsmono')
        success_msg: JetBrains Mono Nerd Font found in fc-list output
