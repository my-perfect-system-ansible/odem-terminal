---
- name: Resolve identity facts when missing
  ansible.builtin.include_role:
    name: odem.os.user
    tasks_from: identity.yml
    public: true
  when: user_resolved is not defined or user_default_repo_dir_mps is not defined

- name: Check if repo directory exists
  ansible.builtin.file:
    path: "{{ fonts_repos_dir }}"
    state: directory
    mode: "0777"
    owner: "root"
    group: "root"

- name: Check if mps-terminal-fonts directory exists
  ansible.builtin.stat:
    path: "{{ fonts_repos_dir }}/mps-terminal-fonts"
  register: fonts_repo_dir

- name: Check if mps-terminal-fonts is a Git repository
  ansible.builtin.stat:
    path: "{{ fonts_repos_dir }}/mps-terminal-fonts/.git"
  register: fonts_git_dir
  when: fonts_repo_dir.stat.exists

- name: Clone mps-terminal-fonts repository
  ansible.builtin.git:
    repo: "{{ fonts_repo }}"
    dest: "{{ fonts_repos_dir }}/mps-terminal-fonts"
    version: "{{ fonts_version }}"
    force: true
  become: true
  when: not fonts_repo_dir.stat.exists

- name: Ensure permissions for target directory
  ansible.builtin.file:
    path: "{{ fonts_repos_dir }}/mps-terminal-fonts"
    state: directory
    owner: "root"
    group: "{{ user_default_admin_group }}"
    recurse: yes
    mode: "2775"
  become: true

- name: Pull mps-terminal-fonts repository
  ansible.builtin.git:
    repo: "{{ fonts_repo }}"
    dest: "{{ fonts_repos_dir }}/mps-terminal-fonts"
    version: "{{ fonts_version }}"
    force: true
    update: true
  become: true
  when:
    - fonts_repo_dir.stat.exists
    - fonts_git_dir.stat.exists

- name: Run mps-terminal-fonts installer
  ansible.builtin.command:
    cmd: bash {{ fonts_repos_dir }}/mps-terminal-fonts/install.sh
  become: true
  changed_when: true