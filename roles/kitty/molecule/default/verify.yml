---
# Lightweight verify for odem.terminal.kitty: the kitty package is installed
# and molecule_user's config directory exists.

- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Gather installed packages
      ansible.builtin.package_facts:

    - name: kitty package is installed
      ansible.builtin.assert:
        that:
          - "'kitty' in ansible_facts.packages"

    - name: molecule_user kitty config directory exists
      ansible.builtin.stat:
        path: /home/molecule_user/.config/kitty
      register: kitty_config
      failed_when: not kitty_config.stat.exists
