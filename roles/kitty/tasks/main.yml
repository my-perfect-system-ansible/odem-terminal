---
- name: Resolve identity facts when missing
  ansible.builtin.include_role:
    name: odem.os.user
    tasks_from: identity.yml
    public: true
  when: user_resolved is not defined or user_default_repo_dir_mps is not defined

- name: Install kitty package (Debian)
  ansible.builtin.package:
    name: kitty
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Install kitty package via dnf CLI
  ansible.builtin.command: dnf install -y kitty
  when: ansible_facts['os_family'] == 'RedHat'
  register: dnf_install_kitty
  changed_when: "'Nothing to do' not in dnf_install_kitty.stdout"

- name: Set kitty as x-terminal-emulator alternative
  ansible.builtin.command:
    cmd: update-alternatives --set x-terminal-emulator /usr/bin/kitty
  changed_when: false
  failed_when: false
  when:
    - kitty_enable_alternatives | bool
    - ansible_facts['os_family'] == 'Debian'

- name: Check if repo directory exists
  ansible.builtin.file:
    path: "{{ kitty_repos_dir }}"
    state: directory
    mode: "0777"
    owner: "root"
    group: "root"

- name: Check if mps-terminal-kitty directory exists
  ansible.builtin.stat:
    path: "{{ kitty_repos_dir }}/mps-terminal-kitty"
  register: kitty_repo_dir

- name: Check if mps-terminal-kitty is a Git repository
  ansible.builtin.stat:
    path: "{{ kitty_repos_dir }}/mps-terminal-kitty/.git"
  register: kitty_git_dir
  when: kitty_repo_dir.stat.exists

- name: Clone mps-terminal-kitty repository
  ansible.builtin.git:
    repo: "{{ kitty_repo }}"
    dest: "{{ kitty_repos_dir }}/mps-terminal-kitty"
    version: "{{ kitty_version }}"
    force: true
  become: true
  when: not kitty_repo_dir.stat.exists

- name: Ensure permissions for target directory
  ansible.builtin.file:
    path: "{{ kitty_repos_dir }}/mps-terminal-kitty"
    state: directory
    owner: "root"
    group: "{{ user_default_admin_group }}"
    recurse: yes
    mode: "2775"
  become: true

- name: Pull mps-terminal-kitty repository
  ansible.builtin.git:
    repo: "{{ kitty_repo }}"
    dest: "{{ kitty_repos_dir }}/mps-terminal-kitty"
    version: "{{ kitty_version }}"
    force: true
    update: true
  become: true
  when:
    - kitty_repo_dir.stat.exists
    - kitty_git_dir.stat.exists

- name: Ensure per-user kitty config directory exists
  ansible.builtin.file:
    path: "{{ entity.home }}/.config/kitty"
    state: directory
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0700"
  loop: "{{ user_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.terminal_kitty | default(false)
    - entity.state == 'present'

- name: Deploy per-user kitty configuration tree
  ansible.builtin.copy:
    src: "{{ kitty_repos_dir }}/mps-terminal-kitty/config/kitty/"
    dest: "{{ entity.home }}/.config/kitty/"
    remote_src: true
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    # NOTE: with remote_src + directory src, `mode` is applied to the
    # destination directory itself (not the files) — the dir is pre-created
    # at 0700 above instead. directory_mode covers subdirectories.
    directory_mode: "0700"
  loop: "{{ user_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.terminal_kitty | default(false)
    - entity.state == 'present'
